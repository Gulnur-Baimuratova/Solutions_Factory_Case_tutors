<div class="demo" id="demo"></div><script>// ===== Синтетические данные (условные дети, имена изменены) =====
let _s=20260930; const rnd=()=>{_s=(_s*1103515245+12345)%2147483648; return _s/2147483648;};

const N=DAYS.length, W0=N-60; // окно анализа — последние 60 дней наблюдений

 {id:'c1',name:'Миша К.',age:'6 лет',diag:'РАС',tutor:'Анна Сергеевна',parent:'Мама — Ольга К.',doctorConsent:true,

  anamnesis:'РАС, заключение ЦПМПК от 03.2025. Наблюдается у невролога. Нарушения сна в анамнезе.'},
 {id:'c2',name:'Алиса Р.',age:'5 лет',diag:'ЗПР',tutor:'Анна Сергеевна',parent:'Папа — Игорь Р.',doctorConsent:false,

  sensory:'Чувствительна к шуму и многолюдным помещениям; в тишине ест и общается лучше.',

(function gen(){
 // --- Миша: связь «сон < 8 ч → агрессия»: 14 дней недосыпа, из них 10 с агрессией; 46 других, из них 7 с агрессией
 const a=[]; for(let i=0;i<N;i++) a.push(baseRec(i,'c1'));

 const others=[...Array(60).keys()].map(k=>W0+k).filter(i=>!short.has(i)); const aggO=new Set(); while(aggO.size<7) aggO.add(pick(others));
 for(let i=0;i<W0;i++){ if(rnd()<0.2){a[i].sleepH=6.5+(rnd()<0.5?0.5:0); if(rnd()<0.7)a[i].episodes.push({t:'Агрессия',n:1+(rnd()<0.4?1:0),ante:pick(ANTE),dur:3});} else if(rnd()<0.12) a[i].episodes.push({t:'Агрессия',n:1,ante:pick(ANTE),dur:2}); }
 for(let i=W0;i<N;i++){ const r=a[i]; if(short.has(i)){r.sleepH=6+Math.round(rnd()*3)/2; r.sleepQ=1;} else if(r.sleepH<8) r.sleepH=8;
   if(aggS.has(i)||aggO.has(i)){ r.episodes.push({t:'Агрессия',n:1+(short.has(i)&&rnd()<0.5?1:0),ante:short.has(i)?pick(['Требование','Переход','Не установлено']):pick(ANTE),dur:2+Math.floor(rnd()*4)}); r.mood=Math.max(1,r.mood-1); } }
 for(let i=0;i<N;i++){ const r=a[i]; r.speech=Math.min(5,2+Math.round(i/N*1.4+rnd()*0.8)); r.init=i>N*0.6?(rnd()<0.7?1:0):(rnd()<0.4?1:0); if(rnd()<0.25) r.episodes.push({t:'Стереотипии',n:1+Math.floor(rnd()*3),ante:'Не установлено',dur:1}); if(rnd()<0.2) r.sensory.push({s:'Шум',r:'избегает'}); }
 a[N-1].comment='С утра вялый, мама сказала, что уснул поздно. На математике оттолкнул соседа, когда попросили сменить задание. После сенсорной паузы успокоился.';
 a[N-2].comment='Трудно переключался между занятиями, на прогулке кричал.'; a[N-2].episodes.push({t:'Крик',n:1,ante:'Переход',dur:2});
 a[N-1].mood=2; a[N-2].mood=2;

 const noise=idxSet(W0,N,10,new Set(),[W0+3,W0+30,W0+52]); const nArr=[...noise]; const fN=new Set(nArr.slice(0,7));

 for(let i=0;i<N;i++){ const r=b[i]; r.speech=Math.min(5,1+Math.round(i/N*3+rnd()*0.6)); r.init=i>N*0.5?(rnd()<0.8?1:(rnd()<0.5?2:0)):(rnd()<0.3?1:0);
   if(i>=W0){ if(noise.has(i)){r.env.noise=true; r.sensory.push({s:'Шум',r:'избегает'});} if(fN.has(i)||fO.has(i)){ r.food=[2,rnd()<0.5?0:1,1]; r.mood=Math.max(1,r.mood-1);} }
   else if(rnd()<0.12){ r.env.noise=true; if(rnd()<0.6) r.food=[2,1,1]; } }
 b[N-1].comment='Хорошо включилась в игру с Соней, сама попросила мяч фразой «дай мяч».';

 const c=[]; for(let i=0;i<N;i++){const r=baseRec(i,'c3'); r.speech=Math.min(5,2+Math.round(i/N*1.2+rnd()*0.7)); r.init=rnd()<0.7?1:2; r.env.noise=false; c.push(r);}
 c[N-1].food=[0,0,1]; c[N-2].food=[0,0,0]; c[N-1].mood=2; c[N-2].mood=2; c[N-1].comment='Отказался от завтрака и обеда, жаловался, что болит горло.'; c[N-1].env.ill=true;

// Уже принятые ранее решения по подсказкам (история для метрики)
const DECISIONS=[
 {cid:'c1',title:'Переход между занятиями → крик',st:'accepted',date:'12.09',by:'Е. В. Логинова, дефектолог'},

 {cid:'c3',title:'Понедельник → ниже речевая активность',st:'rejected',date:'05.09',by:'М. А. Сафина, логопед',reason:'Банальная связь: после выходных нужна разминка, уже учтено в ИОМ'},
 {cid:'c1',title:'Утяжелённый жилет → меньше стереотипий',st:'edited',date:'03.09',by:'Е. В. Логинова, дефектолог'},
];

 c1:[{d:'29.09',who:'Дефектолог',goal:'Просьба о помощи карточкой PECS',res:'4 из 6 проб самостоятельно',video:true},{d:'25.09',who:'Логопед',goal:'Звукоподражания',res:'Повторяет 5 из 8',video:false},{d:'23.09',who:'Дефектолог',goal:'Групповое занятие 15 мин',res:'Выдержал 11 минут',video:true}],

// ===== Расчётное ядро: светофор и поиск связей (детерминированно) =====
const PARAMS=[
 {k:'sleep',n:'Сон',v:r=>r.sleepH,better:1,unit:'ч',med:true},
 {k:'food',n:'Питание',v:r=>r.food.reduce((a,b)=>a+b,0),better:1,unit:'из 6',med:true},
 {k:'mood',n:'Эмоции',v:r=>r.mood,better:1,unit:'из 5'},
 {k:'comm',n:'Коммуникация',v:r=>r.init*2+r.speech,better:1,unit:'балл'},
 {k:'beh',n:'Поведение',v:r=>r.episodes.filter(e=>e.t!=='Стереотипии').reduce((a,e)=>a+e.n,0),better:-1,unit:'эпизодов',med:true},
];
const mean=a=>a.reduce((x,y)=>x+y,0)/(a.length||1);
const sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))||0;};
function isCritical(recs,i){ const r=recs[i]; if(r.episodes.some(e=>e.t==='Самоагрессия')) return 'Самоагрессия';
  const refuse=x=>x&&x.food.filter(f=>f===0).length>=2; if(refuse(r)&&refuse(recs[i-1])) return 'Отказ от еды 2 дня подряд'; return null; }
// Цвет параметра за день относительно личной базовой линии за предыдущие 28 дней
function dayColors(recs,i){
  const out={}; let worst='g';

// Поиск повторяющихся связей «фактор → исход» за последние 60 дней наблюдений
const FACTORS=[
 {k:'sleep',n:'сон меньше 8 часов',f:r=>r.sleepH<8},{k:'noise',n:'шумная обстановка',f:r=>r.env.noise},
 {k:'schedule',n:'смена расписания',f:r=>r.env.schedule},{k:'newPerson',n:'новый человек',f:r=>r.env.newPerson}];
const OUTCOMES=[
 {k:'aggr',n:'эпизоды агрессии',f:r=>r.episodes.some(e=>e.t==='Агрессия')},
 {k:'food',n:'трудности с едой',f:r=>r.food.some(x=>x===0)||r.food.filter(x=>x===1).length>=2},
 {k:'mood',n:'сниженное настроение',f:r=>r.mood<=2}];
const TH={minF:8,ratio:2,parts:2};
function findLinks(cid){
  const recs=OBS[cid], win=recs.filter(r=>r.date<TODAY).slice(-60), out=[]; // ночной расчёт по данным до вчерашнего дня включительно
  for(const F of FACTORS) for(const O of OUTCOMES){
    const withF=win.filter(F.f), noF=win.filter(r=>!F.f(r));
    const a=withF.filter(O.f).length, b=noF.filter(O.f).length;
    const pF=a/(withF.length||1), pN=b/(noF.length||1);
    const co=win.map((r,j)=>F.f(r)&&O.f(r)?j:-1).filter(j=>j>=0); const parts=new Set(co.map(j=>Math.floor(j/20))).size;
    const ratio=pN>0?pF/pN:(pF>0?99:0);
    const ok=withF.length>=TH.minF && ratio>=TH.ratio && pF>=0.5 && parts>=TH.parts;
    if(ok) out.push({id:`H-${cid}-${F.k}-${O.k}`,cid,F,O,nF:withF.length,a,nN:noF.length,b,pF,pN,ratio,
      days:win.filter(F.f).map(r=>({r,hit:O.f(r)})), parts});
  }
  return out.sort((x,y)=>y.ratio-x.ratio);
}
